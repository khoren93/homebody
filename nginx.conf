# Static hosting for the Homebody single-page app.
# Runs inside nginx-unprivileged: non-root, listening on 8080.

# Hashed build assets never change, so they can be cached forever. The HTML
# shell, the service worker and the web manifest must always be revalidated,
# otherwise clients would keep running an old version of the app.
map $uri $cache_control {
    default                         "no-cache";
    ~^/assets/                      "public, max-age=31536000, immutable";
    ~^/exercises/                   "public, max-age=2592000";
    ~*\.(?:woff2?|png|svg|ico|webp)$ "public, max-age=604800";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Only on successful responses: an error must never be cached as immutable.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing files under these paths are real 404s, not app routes.
    location ~ ^/(?:assets|exercises)/ {
        try_files $uri =404;
    }

    # Everything else falls back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
