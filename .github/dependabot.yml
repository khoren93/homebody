version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vite-and-vitest:
        patterns: ['vite', 'vitest', '@vitejs/*', '@vitest/*', 'vite-plugin-*']
      lint-and-format:
        patterns: ['eslint', '@eslint/*', 'eslint-*', 'typescript-eslint', 'prettier', 'globals']
      testing:
        patterns: ['@testing-library/*', 'jsdom', '@playwright/test']
      commit-tooling:
        patterns: ['lefthook', '@commitlint/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
