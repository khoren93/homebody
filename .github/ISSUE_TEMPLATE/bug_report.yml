name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the plan
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 19 on iPhone 16, installed as an app
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - Russian
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Screenshots help. For a calculation problem, a backup file (Settings → Backup) lets us
        reproduce it; remove anything you do not want to share first.
